spring:
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # 使用 dynamic-datasource-spring-boot-starter 配置
  datasource:
    # 动态SQL生成器配置
    sql-generator:
      # 指定使用的数据库类型：mysql 或 doris
      type: mysql
    dynamic:
      # 设置默认的数据源或者数据源组, 默认值即为 master
      primary: master
      # 设置严格模式,默认 false. 严格模式下未匹配到数据源直接报错, 非严格模式下则使用默认数据源 primary 配置的数据源
      strict: false
      # p6spy 开关, 默认 false
      p6spy: false
      # seata 开关, 默认 false
      seata: false
      # 数据源配置信息
      datasource:
        # 主数据源 (MySQL)
        master:
          url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:agent_platform}?serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowMultiQueries=true&socketTimeout=300000&useSSL=false
          driver-class-name: com.mysql.cj.jdbc.Driver
          username: ${DB_USERNAME:root}
          password: ${DB_PASSWORD:your_mysql_password}
          # 以下为 Druid 连接池配置 (如果使用)
          druid:
            initial-size: 5
            min-idle: 5
            max-active: 20
            max-wait: 60000
            time-between-eviction-runs-millis: 60000
            min-evictable-idle-time-millis: 300000
            validation-query: SELECT 1 FROM DUAL
            test-while-idle: true
            test-on-borrow: false
            test-on-return: false
            pool-prepared-statements: true
            max-pool-prepared-statement-per-connection-size: 20
            filters: stat # 启用 stat filter 用于监控
        # Doris 数据源
        doris:
          url: jdbc:mysql://${DORIS_HOST:localhost}:3306/${DORIS_DB_NAME:agent_custom_table}?serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowMultiQueries=true&socketTimeout=300000&useSSL=false
          driver-class-name: com.mysql.cj.jdbc.Driver
          username: ${DORIS_USERNAME:root}
          password: ${DORIS_PASSWORD:your_doris_password}
          # Doris 表配置
          table:
            replication-num: 1 # 副本数，生产环境通常为3，开发环境可以为1
            bucket-num: 10 # 分桶数
            duplicate-key: id # 重复键字段名，默认使用第一个字段
            distributed-key: id # 分布键字段名，默认使用第一个字段
          # 可选: 如果 Doris 也用 Druid，可以添加 druid 配置
          druid:
            initial-size: 2
            min-idle: 2
            max-active: 10
            max-wait: 60000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:your_redis_password}
      database: ${REDIS_DB:1}
      lettuce:
        pool:
          max-idle: 16
          max-active: 32
          min-idle: 8

  main:
    allow-circular-references: true
log:
  level: DEBUG

# 知识库文档解析并发限制(DocumentParseBudget): 限制同时在解析中的文档总字节数,防止批量上传大文件并行解析导致 OOM
knowledge:
  parse:
    # 并发解析的总字节预算,默认 128MB(约按 2GB 堆的 1/16 取值)
    budget-bytes: ${KNOWLEDGE_PARSE_BUDGET_BYTES:134217728}
    # 大文件阈值,超过则转入全局串行解析(不占预算),默认 100MB
    big-file-threshold-bytes: ${KNOWLEDGE_PARSE_BIG_FILE_THRESHOLD:104857600}
    # 文档解析(分段)线程数——吞吐旋钮,内存安全由字节预算+图片直拷保障,默认 20
    raw-executor-threads: ${KNOWLEDGE_PARSE_RAW_EXECUTOR_THREADS:20}
    # 获取解析许可的超时秒数(排队等待上限),默认 2 分钟
    acquire-timeout-seconds: ${KNOWLEDGE_PARSE_ACQUIRE_TIMEOUT:120}
    # 租约存活上限秒数,超过视为解析挂起,看门狗强制回收预算/串行锁,默认 5 分钟
    lease-ttl-seconds: ${KNOWLEDGE_PARSE_LEASE_TTL:300}

server:
  port: 8081

jwt:
  secretKey: ${JWT_SECRET_KEY:your_jwt_secret_key_minimum_32_characters}

# 静态资源访问基址（图片等资源的对外前缀）
resource:
  baseUrl: ${RESOURCE_BASE_URL:}

file:
  uploadFolder: ${FILE_UPLOAD_FOLDER:/tmp/uploads}
  baseUrl: ${FILE_BASE_URL:https://your-file-domain.com/files/}

# Storage configuration
storage:
  type: ${STORAGE_TYPE:local}  # Storage type: local, cos(Tencent Cloud), oss(Alibaba Cloud), s3(S3 protocol/MinIO)

local:
  upload:
    folder: ${LOCAL_UPLOAD_FOLDER:/tmp/uploads}

# Tencent Cloud COS configuration (takes effect when storage.type=cos)
cos:
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  region: ${COS_REGION:ap-chengdu}
  bucket-name: ${COS_BUCKET_NAME:}
  endpoint: ${COS_ENDPOINT:}
  # Legacy configuration below
  secretId: ${COS_SECRET_ID:}
  secretKey: ${COS_SECRET_KEY:}
  baseUrl: ${COS_BASE_URL:}

# Alibaba Cloud OSS configuration (takes effect when storage.type=oss)
oss:
  endpoint: ${OSS_ENDPOINT:}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  region-name: ${OSS_REGION_NAME:cn-chengdu}
  bucket-name: ${OSS_BUCKET_NAME:}

# S3 protocol configuration (takes effect when storage.type=s3, supports MinIO etc.)
s3:
  endpoint: ${S3_ENDPOINT:}
  access-key: ${S3_ACCESS_KEY:}
  secret-key: ${S3_SECRET_KEY:}
  bucket-name: ${S3_BUCKET_NAME:}
  region: ${S3_REGION:us-east-1}
  # 对外访问代理基址：非空时用它替换 endpoint 前缀生成文件 URL（如 https://s3p.example.com:9443）
  proxy: ${S3_PROXY:}

vector-store:
  engine: milvus

milvus:
  uri: ${MILVUS_URI:http://localhost:19530}
  user: ${MILVUS_USER:root}
  password: ${MILVUS_PASSWORD:your_milvus_password}

code:
  execute:
    url: ${CODE_EXECUTE_URL:http://localhost:8020/api/run_code_with_log}

# 日志模块配置
log-module:
  log:
    rust-service:
      # Rust 日志服务的基础 URL
      base-url: ${LOG_SERVICE_URL:http://localhost:8097}
      # 连接超时时间（秒）
      connect-timeout-seconds: 10
      # 写入超时时间（秒）
      write-timeout-seconds: 30
      # 读取超时时间（秒）
      read-timeout-seconds: 30
      # 是否启用连接池
      enable-connection-pool: true
      # 最大空闲连接数
      max-idle-connections: 5
      # 连接保持存活时间（分钟）
      keep-alive-duration-minutes: 5

search:
  elasticsearch:
    url: ${ES_URL:http://localhost:9200}
    username: ${ES_USERNAME:elastic}
    password: ${ES_PASSWORD:your_elasticsearch_password}
    api_key: ${ES_API_KEY:}
# 生态市场模块配置
eco-market:
  # 服务端配置
  server:
    # 远程server端的 ip端口配置
    base-url: ${ECO_MARKET_SERVER_URL:https://market-api.nuwax.com}
  # 生态市场前端地址（后台跳转与通知展示用）
  web:
    base-url: ${ECO_MARKET_WEB_URL:https://eco.nuwax.com}
  client:
    # 客户端配置
    retry:
      #自动注册客户端到 server端, 重试间隔时间，单位：秒;
      interval: 300

mcp:
  proxy-base-url: ${MCP_PROXY_URL:http://localhost:8020}

knife4j:
  # 开启增强配置
  enable: true
  # 标识是否生产环境：true-生产环境关闭文档，false-显示文档
  production: false

custom-page:
  http-proxy:
    host: ${CUSTOM_PAGE_PROXY_HOST:0.0.0.0}
    port: ${CUSTOM_PAGE_PROXY_PORT:18082}
  # 官方接入域名（CNAME 指向校验）：custom-page 与 userapp 自定义域名绑定共用
  cnames: ${CUSTOM_PAGE_CNAMES:}
  dev-server-host: ${DEV_SERVER_HOST:http://localhost}
  prod-server-host: ${PROD_SERVER_HOST:http://localhost:8099}
  build-server:
    base-url: ${BUILD_SERVER_URL:http://localhost:60000/api}
  ai-agent:
    base-url: ${AI_AGENT_URL:http://localhost:8086}
  docker-proxy:
    enable: ${DOCKER_PROXY_ENABLE:true}
    base-url: ${DOCKER_PROXY_URL:http://localhost:8088}

# 全栈应用数据库凭证加密密钥（AES，Base64，16/24/32 字节）
userapp:
  http-proxy:
    host: ${USERAPP_PROXY_HOST:0.0.0.0}
    port: ${USERAPP_PROXY_PORT:19001}
  credential:
    aes-key: ${USERAPP_CREDENTIAL_AES_KEY:}
  domain:
    # 全栈应用平台域名后缀（随机前缀 + 该后缀生成系统绑定域名）
    dev-suffix: ${USERAPP_DOMAIN_DEV_SUFFIX}
    prod-suffix: ${USERAPP_DOMAIN_PROD_SUFFIX}

computer:
  proxy:
    host: ${COMPUTER_PROXY_HOST:0.0.0.0}
    port: ${COMPUTER_PROXY_PORT:18085}

supportCustomDomain: true

# 内外穿透相关服务配置
reverse:
  server:
    # 内部服务器配置
    inner:
      # 内部服务可访问地址，如果分布式部署，可以在每台主机上通过环境变量制定 SERVICE_HOST
      service-host: ${SERVICE_HOST:127.0.0.1}
      # 绑定主机地址，如果分布式部署，可以在每台主机上通过环境变量制定 BIND_HOST
      bind-host: ${BIND_HOST:0.0.0.0}
      # 内部服务器端口范围
      ports: ${REVERSE_PORTS:30000-40000}
    # 外部服务器配置
    outer:
      # 外部用于与客户端保持连接的服务器主机地址，多个用英文逗号隔开，例如 192.168.1.12,192.168.1.13，留空时使用平台服务器地址
      host: ${OUTER_HOST:}
      # 外部服务器端口
      port: ${OUTER_PORT:10076}

model-api-proxy:
  base-api-url: ${MODEL_API_BASE_URL:}
  enable-model-proxy: ${MODEL_PROXY_ENABLE:true}
  port: ${MODEL_PROXY_PORT:18086}
  #记录日志
  save-log: ${MODEL_PROXY_SAVE_LOG:true}

# 沙箱临时链接：子域名形态的免登录访问入口
sandbox:
  temp-link:
    # 临时链接根域名（裸域名，如 example.com；不可填带协议的前缀）
    # 留空则禁用临时链接能力（ApiForSandboxController 直接拒绝）
    base-domain: ${SANDBOX_TEMP_LINK_BASE_DOMAIN:}
    proxy:
      # 反向代理监听端口（ReverseHttpProxyServer）
      port: ${SANDBOX_TEMP_LINK_PROXY_PORT:18087}

# 图数据库地址（随生产配置保留；本服务代码未读取）
surrealdb:
  url: ${SURREALDB_URL:}

# 授权许可（随生产配置保留；本服务代码未读取）
license: ${LICENSE:}

speech:
  asr:
    provider: dashscope  # volc | dashscope
    # 共用静音断句；切换 volc/dashscope 时保持一致。各 provider 可单独覆盖。
    sentence-silence-ms: 600
    # 百炼等空闲约 23s 超时后静默换会话，继续听音
    timeout-silent-rebuild: true
    rebuild-max-attempts: 3
    rebuild-replay-ms: 400
    volc:
      endpoint: wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_async
      api-key: ${ASR_VOLC_API_KEY:}
      app-key: ${ASR_VOLC_APP_KEY:}
      access-key: ${ASR_VOLC_ACCESS_KEY:}
      resource-id: volc.seedasr.sauc.duration
      chunk-ms: 200
      # ≤0 则用 asr.sentence-silence-ms；实际下发 clamp ≥200
      end-window-size-ms: 0
      # ≤0 则用 200；配合 end_window_size，否则短句前约 10s 才允许判停
      force-to-speech-time-ms: 200
      connect-timeout-ms: 5000
      send-timeout-ms: 10000
      result-timeout-ms: 15000
    dashscope:
      workspace-id: ${ASR_DASHSCOPE_WORKSPACE_ID:}
      api-key: ${ASR_DASHSCOPE_API_KEY:}
      region: cn-beijing
      model: fun-asr-realtime
      format: pcm
      sample-rate: 16000
      chunk-ms: 200
      # ≤0 则用 asr.sentence-silence-ms（对应 max_sentence_silence）
      max-sentence-silence-ms: 0
      speech-noise-threshold: 0.3
      connect-timeout-ms: 5000
      send-timeout-ms: 10000
      result-timeout-ms: 15000
  tts:
    provider: dashscope  # volc | dashscope
    # 流式合并：少碎 feed，降低空等
    batch-min-chars: 8
    batch-max-hold-ms: 120
    warmup-on-start: true
    # 下行限速：prebuffer 内可突发，之后相邻帧间隔 ≥ frame_duration_ms
    downlink-pace-enabled: false
    downlink-prebuffer-ms: 800
    downlink-max-buffered-ms: 2000
    pending-pcm-max-buffered-ms: 60000
    # 距上次 feed 超过该空闲仍强制喂字，避免百炼 ~23s 空闲超时
    feed-max-idle-ms: 12000
    # 空闲无待喂文本时主动喂给 provider 的保活文本（重置其空闲计时）；置空关闭主动保活
    feed-keepalive-text: "，"
    # 兜底：仍超时则静默换会话继续喂字（真实文本喂字成功后重建额度自动重置）
    timeout-silent-rebuild: true
    rebuild-max-attempts: 3
    volc:
      endpoint: wss://openspeech.bytedance.com/api/v3/tts/bidirection
      api-key: ${TTS_VOLC_API_KEY:}
      app-key: ${TTS_VOLC_APP_KEY:}
      access-key: ${TTS_VOLC_ACCESS_KEY:}
      resource-id: seed-tts-2.0
      speaker: ${TTS_VOLC_SPEAKER:zh_female_vv_uranus_bigtts}
      model: seed-tts-2.0-standard
      connect-timeout-ms: 5000
      send-timeout-ms: 10000
      session-timeout-ms: 30000
      chunk-wait-ms: 200
      non-flush-chunk-wait-ms: 0
    dashscope:
      workspace-id: ${TTS_DASHSCOPE_WORKSPACE_ID:}
      api-key: ${TTS_DASHSCOPE_API_KEY:}
      region: cn-beijing
      model: cosyvoice-v3-flash
      voice: longxing_v3
      format: pcm
      sample-rate: 16000
      rate: 1.1
      volume: 50
      pitch: 1.0
      connect-timeout-ms: 5000
      send-timeout-ms: 10000
      session-timeout-ms: 30000
      chunk-wait-ms: 200
      non-flush-chunk-wait-ms: 0

# ===== 连接器 / IM RPC / 消息队列 =====
nuwax:
  connector:
    # 加密主密钥（Base64 32字节 或 Hex 64字符）
    # 读取优先级：System property NUWAX_CONNECTOR_ENCRYPTION_KEY > 本配置 > 环境变量 NUWAX_CONNECTOR_ENCRYPTION_KEY
    encryption-key: ${NUWAX_CONNECTOR_ENCRYPTION_KEY:}
    # SSRF 防护（GuardedHttpClient）
    guard:
      allow-private: ${CONNECTOR_GUARD_ALLOW_PRIVATE:false}        # 是否放行内网/私网地址（自托管场景才开）
      enforce: ${CONNECTOR_GUARD_ENFORCE:true}                     # true=拦截私网请求；false=观察模式
      timeout-ms: ${CONNECTOR_GUARD_TIMEOUT_MS:60000}              # 全局请求超时上限（毫秒）
      max-response-bytes: ${CONNECTOR_GUARD_MAX_RESPONSE_BYTES:1048576}  # 响应体大小上限（字节，1MB）
  # IM 业务平面 RPC 适配
  im:
    adapter:
      # 关闭后调用一律抛异常（拒绝，不是静默跳过）
      enabled: ${IM_RPC_ENABLED:false}
      # 内网直连地址（形如 http://192.168.1.10:18092）：
      # 填对外域名会得到 HTTP 405 或 404，而不是“验签失败”
      base-url: ${IM_RPC_BASE_URL:}
      # 调用方标识，决定配额与密钥索引
      app-id: ${IM_RPC_APP_ID:app-platform-im}
      # 与 app-id 一一对应的 HMAC 密钥；绝不入日志、不入库、不回显
      secret: ${IM_RPC_SECRET_PLATFORM_IM:}
      # 契约版本，当前固定 v1
      api-version: ${IM_RPC_API_VERSION:v1}
      # 单次请求读超时
      timeout: ${IM_RPC_TIMEOUT:3s}
      # 连接超时
      connect-timeout: ${IM_RPC_CONNECT_TIMEOUT:3s}
  # 消息队列（随生产配置保留；本服务代码未读取）
  mq:
    enabled: ${NUWAX_MQ_ENABLED:false}
    # broker 地址，如 192.168.1.10:30141
    endpoints: ${NUWAX_MQ_ENDPOINTS:}
    request-timeout: ${NUWAX_MQ_REQUEST_TIMEOUT:3s}
